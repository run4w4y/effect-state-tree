name: Publish development snapshot

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or full commit SHA to snapshot
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: effect-tree-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Resolve snapshot identity
        id: snapshot
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=snapshot-$commit" >> "$GITHUB_OUTPUT"

      - name: Refuse to replace an existing snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: ${{ steps.snapshot.outputs.tag }}
        run: |
          if gh release view "$SNAPSHOT_TAG" >/dev/null 2>&1; then
            echo "Snapshot already exists: $SNAPSHOT_TAG" >&2
            exit 1
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Check workspace
        run: bun run check

      - name: Pack public packages
        run: bun run snapshot:pack

      - name: Create draft snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_COMMIT: ${{ steps.snapshot.outputs.commit }}
          SNAPSHOT_TAG: ${{ steps.snapshot.outputs.tag }}
        run: |
          gh release create "$SNAPSHOT_TAG" \
            --target "$SNAPSHOT_COMMIT" \
            --title "Development snapshot ${SNAPSHOT_COMMIT:0:12}" \
            --notes "Unsupported development snapshot built from commit $SNAPSHOT_COMMIT. Download the individual package archives from the assets below. See the repository README for Bun override instructions." \
            --prerelease \
            --draft

      - name: Attach snapshot assets
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: ${{ steps.snapshot.outputs.tag }}
        run: gh release upload "$SNAPSHOT_TAG" dist/packages/*.tgz

      - name: Publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: ${{ steps.snapshot.outputs.tag }}
        run: gh release edit "$SNAPSHOT_TAG" --draft=false --prerelease
